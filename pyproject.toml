[project]
name = "modelforge"
version = "0.1.0"
description = "An engineering framework for translating quantitative research into reliable, testable, reproducible software."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Karan" }]

dependencies = [
    # Upper bound: numpy>=2.5 ships .pyi stubs using PEP 695 `type` aliases,
    # which mypy cannot parse under [tool.mypy] python_version = "3.11"
    # (this project's declared floor). Revisit once mypy or numpy resolves
    # checking such stubs against older target versions.
    "numpy>=1.26,<2.5",
    "pandas>=2.2",
    "pydantic>=2.6",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "mypy>=1.9",
    "ruff>=0.4",
    "black>=24.3",
    "pandas-stubs>=2.2",
]

[project.scripts]
modelforge = "modelforge.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modelforge"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# "src" lets the suite run against the working tree directly (via pytest's own
# sys.path insertion) without depending on an editable install being wired up
# correctly; "." makes `tests` importable as a package for cross-module
# imports like `from tests.conftest import ...`.
pythonpath = ["src", "."]
